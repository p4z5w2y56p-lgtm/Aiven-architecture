[project]
name = "aiven"
version = "0.1.0"
description = "AIVEN Architecture: safety gateway for AI agents (policy validator, gateway, control UI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "markdown-it-py>=4.2.0",
    "ruamel.yaml",
]

[project.scripts]
aiven-policy = "aiven.policy.cli:main"
aiven-check-config = "aiven.common.config_guard:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiven"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
