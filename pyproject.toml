[project]
name = "aiven"
version = "0.1.0"
description = "AIVEN Architecture: safety gateway for AI agents (policy validator, gateway, control UI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "markdown-it-py>=4.2.0",
    "ruamel.yaml",
]

[project.scripts]
aiven-policy = "aiven.policy.cli:main"
aiven-check-config = "aiven.common.config_guard:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
functions = [
    "functions-framework==3.10.2",
    "google-cloud-billing==1.20.0",
    "google-cloud-logging==3.16.3",
    "tzdata==2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiven"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.uv]
# A release is taken once it is two weeks old (supply chain; ruling R131). The two dev tools that M1
# locked keep their versions. A later task that needs a newer release moves the date on purpose.
exclude-newer = "2026-09-29T00:00:00Z"
exclude-newer-package = { ruff = "2026-10-12T00:00:00Z", iniconfig = "2026-10-12T00:00:00Z" }
# The functions' libraries come with `uv sync`, for their tests.
default-groups = ["dev", "functions"]
