agents_project: aiven-agents-819c3e

# AIVEN accounts whose edits to a Drive file do not make a run untrusted (docs/drive-wrapper.md section 5).
trusted_authors:
  - m.vanhoorn@aivenstudios.com

# The gateway's own service account (docs/drive-wrapper.md section 1).
gateway_principal: gateway@aiven-gateway-819c3e.iam.gserviceaccount.com

# The ID of the Shared Drive "AIVEN Architecture Sandbox" (setup step S5).
sandbox_drive_id: "0ANG6akvi_bACUk9PVA"
