name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run aiven-check-config
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --cov=aiven --cov-branch --cov-fail-under=95
      - name: Template self-test (validator-spec section 9)
        run: |
          # The template has errors of its own, so the validator must exit 1. Exit 0 would mean
          # that it no longer sees them, and 2 that it crashed. The tests compare the output.
          status=0
          uv run aiven-policy validate templates/policy-template.md || status=$?
          test "$status" -eq 1
      - name: Policies (against the base of the pull request, when there is one)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A pull request has a base, and the version order and the widening of a policy are
          # judged against it. A push has none: validate then leaves those two out, and says so
          # on stderr. The platform values are config/platform.yaml, which the deployment commits
          # (ruling R92): project ids, the addresses of the trusted authors, the gateway principal
          # and the drive id, and no credentials. The example values are never a stand-in for
          # them: they name another project, and would fail every real policy (E-PRINCIPAL).
          shopt -s nullglob
          policies=(policies/*.md)
          if [ "${#policies[@]}" -eq 0 ]; then
            echo "No policies yet."
            exit 0
          fi
          if [ ! -f config/platform.yaml ]; then
            echo "config/platform.yaml is missing: commit the deployment's platform values (they hold no credentials)" >&2
            exit 1
          fi
          ref=()
          if [ -n "$BASE_SHA" ]; then
            ref=(--previous-ref "$BASE_SHA")
          fi
          uv run aiven-policy validate --config config/platform.yaml "${ref[@]}" "${policies[@]}"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Terraform 1.16.4, checked against its SHA-256 (ruling R98)
        run: |
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          echo "dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # No backend and no credentials: CI never reaches Google Cloud (ruling R97). The providers must
      # match the hashes in .terraform.lock.hcl, and terraform test runs on a mock provider.
      - run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
